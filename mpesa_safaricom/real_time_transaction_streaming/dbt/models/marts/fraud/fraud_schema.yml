version: 2

sources:
  - name: raw
    description: Raw data tables from streaming platform
    tables:
      - name: fraud_alerts
        description: |
          Real-time fraud detection alerts generated by StreamingFraudDetectionService.
          Populated by Kafka consumer processing transactions through
          ConsolidatedFraudDetectionEngine.
        columns:
          - name: alert_id
            description: Unique alert identifier
            data_type: varchar
          - name: transaction_id
            description: Related transaction ID
            data_type: varchar
          - name: institution
            description: Institution that generated alert (MPESA, KCB_BANK, etc)
            data_type: varchar
          - name: detected_type
            description: Alert type (MPESA_FRAUD, AML_ALERT, NORMAL)
            data_type: varchar
          - name: risk_score
            description: Fraud risk score 0.0-1.0
            data_type: numeric
          - name: severity
            description: Alert severity (LOW, MEDIUM, HIGH, CRITICAL)
            data_type: varchar
          - name: rules_triggered
            description: Pipe-delimited list of fraud rules that triggered
            data_type: text
          - name: detected_timestamp
            description: Time alert was generated
            data_type: timestamp
          - name: ingestion_timestamp
            description: Time alert was written to warehouse
            data_type: timestamp

models:
  - name: stg_fraud_alerts
    description: Staging model for fraud alerts (pass-through)
    columns:
      - name: alert_id
        description: Unique alert identifier
        tests:
          - unique
          - not_null

  - name: mart_fraud_metrics_hourly
    description: |
      Hourly fraud detection metrics aggregated by severity and type.
      Used by streaming dashboard to show fraud trends and patterns.
    columns:
      - name: alert_hour
        description: Hour timestamp (truncated to hour)
        tests:
          - not_null
      - name: severity
        description: Fraud alert severity
        tests:
          - not_null
      - name: detected_type
        description: Type of fraud detection
      - name: total_alerts
        description: Count of alerts in this hour/severity/type
      - name: unique_transactions
        description: Count of unique transactions involved
      - name: avg_risk_score
        description: Average fraud risk score
      - name: max_risk_score
        description: Maximum fraud risk score
      - name: critical_count
        description: Number of CRITICAL severity alerts
      - name: high_count
        description: Number of HIGH severity alerts

  - name: mart_fraud_metrics_daily
    description: |
      Daily fraud detection metrics by institution and type.
      Used for reporting and trend analysis over longer periods.
    columns:
      - name: alert_date
        description: Date of alerts
        tests:
          - not_null
      - name: institution
        description: Originating institution
        tests:
          - not_null
      - name: detected_type
        description: Type of fraud detection
      - name: total_alerts
        description: Count of alerts on this date
      - name: unique_transactions
        description: Unique transactions with alerts
      - name: avg_risk_score
        description: Average risk score for the day
      - name: critical_high_pct
        description: Percentage of alerts with HIGH or CRITICAL severity

  - name: mart_fraud_high_value_summary
    description: |
      High-severity fraud alerts with transaction details.
      Used for case management and investigative workflows.
    columns:
      - name: alert_id
        description: Unique alert identifier
        tests:
          - unique
          - not_null
      - name: transaction_id
        description: Associated transaction
        tests:
          - not_null
      - name: severity
        description: Alert severity
      - name: risk_score
        description: Fraud risk score
      - name: amount
        description: Transaction amount (if available)
      - name: rules_triggered
        description: Rules that caused the alert
